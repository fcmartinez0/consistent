<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Consistent</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0f13;
  --surface:  #1a1a22;
  --surface2: #24242f;
  --border:   #2e2e3e;
  --text:     #e8e8f0;
  --muted:    #7a7a9a;
  --dim:      #4a4a6a;
  --danger:   #e05252;
  --sp:       #a78bfa;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.hidden { display: none !important; }

#onboarding {
  align-items: center;
  justify-content: space-between;
  padding: 40px 24px 32px;
}
.ob-header { text-align: center; }
.ob-title    { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.ob-subtitle { font-size: 14px; color: var(--muted); }

.species-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 360px;
}
.species-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.species-card.selected { border-color: var(--sp); background: rgba(167,139,250,0.1); }
.species-emoji { font-size: 44px; line-height: 1; }
.species-name  { font-size: 17px; font-weight: 700; }
.species-hint  { font-size: 12px; color: var(--muted); text-align: center; }

#beginBtn {
  width: 100%; max-width: 360px; padding: 18px; border: none; border-radius: 14px;
  background: var(--border); color: var(--muted); font-size: 17px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background .2s, color .2s;
}

#home { overflow: hidden; }

.char-section {
  flex-shrink: 0; height: 148px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.char-center {
  position: relative; width: 100px; height: 100px;
  display: flex; align-items: center; justify-content: center;
}
.char-glow {
  position: absolute; inset: 0; border-radius: 50%;
  animation: pulseGlow 4s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { transform: scale(1); opacity: .8; }
  50%       { transform: scale(1.2); opacity: 1; }
}
.char-emoji { font-size: 64px; position: relative; z-index: 1; line-height: 1; }
.char-name  { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.char-mood  { font-size: 13px; color: var(--muted); }

.habit-section {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 0 24px; overflow: hidden;
}
.habit-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; flex-shrink: 0;
}
.habit-header-title { font-size: 16px; font-weight: 700; }
#markAllBtn {
  background: none; border: none; font-family: inherit;
  font-size: 13px; font-weight: 600; color: var(--sp); cursor: pointer; padding: 4px 0;
}
#markAllBtn.hidden-btn { visibility: hidden; }

.habit-grid {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  align-content: center; justify-content: center;
}
.habit-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 14px; text-align: center;
}

.habit-circle {
  border-radius: 50%; border: 2px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 12px; cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .25s; -webkit-tap-highlight-color: transparent; user-select: none;
}
.habit-circle::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: var(--sp); opacity: 0; transition: opacity .28s ease;
}
.habit-circle.done { border-color: var(--sp); }
.habit-circle.done::before { opacity: 1; }
.habit-circle.pop { animation: circlePop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes circlePop {
  0% { transform: scale(1); } 35% { transform: scale(.87); } 100% { transform: scale(1); }
}
.circle-streak { position: relative; z-index: 1; color: rgba(255,255,255,.6); font-weight: 600; line-height: 1; }
.circle-name {
  position: relative; z-index: 1; font-weight: 600; text-align: center; line-height: 1.3;
  color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  overflow: hidden; word-break: break-word; transition: color .25s;
}
.habit-circle.done .circle-name { color: #fff; }
.circle-check { position: relative; z-index: 1; color: rgba(255,255,255,.85); font-weight: 700; line-height: 1; }

/* Date Section */
.date-section { flex-shrink: 0; padding: 0 24px 14px; }
.date-hero {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2px; margin-bottom: 14px;
}
.date-month-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
  color: var(--muted); text-transform: uppercase; flex: 1;
}
.date-day-num {
  font-size: 80px; font-weight: 900; color: var(--sp);
  line-height: 1; letter-spacing: -0.04em; text-align: center; flex: 1;
}
.date-year-lbl {
  font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
  color: var(--dim); text-align: right; flex: 1;
}
.week-strip { display: flex; }
.wday { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wday-lbl { font-size: 9px; font-weight: 700; color: var(--dim); letter-spacing: 0.06em; }
.wday-dot {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, border-color .2s;
}
.wday-dot.is-today  { border: 2px solid var(--sp); }
.wday-dot.is-future { opacity: 0.25; }
.wday-num { font-size: 10px; font-weight: 500; color: var(--dim); line-height: 1; }
.wday-dot.is-today .wday-num { color: var(--sp); font-weight: 800; }

/* Bottom Bar */
.bottom-bar { flex-shrink: 0; padding: 6px 16px 10px; }
.bottom-bar-inner {
  display: flex; align-items: center; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 14px;
  padding: 10px 10px 10px 18px; cursor: pointer; gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-bar-placeholder { flex: 1; color: var(--dim); font-size: 15px; }
.bottom-bar-pill {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff; font-weight: 300; line-height: 1; flex-shrink: 0;
}

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  justify-content: flex-end; z-index: 100;
}
.modal-backdrop { flex: 1; background: rgba(0,0,0,.5); }
.modal-sheet {
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 24px 24px 0 0; padding: 16px 24px 32px;
  display: flex; flex-direction: column; gap: 16px;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.32,1,.6,1);
}
.modal-overlay:not(.hidden) .modal-sheet { transform: translateY(0); }
.modal-handle { width: 40px; height: 4px; border-radius: 2px; background: #3a3a50; align-self: center; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-input {
  background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
  color: var(--text); padding: 14px 16px; font-size: 16px; font-family: inherit;
  outline: none; transition: border-color .2s;
}
.modal-input:focus { border-color: var(--sp); }
.modal-input::placeholder { color: var(--dim); }
.modal-actions { display: flex; gap: 10px; }
.modal-cancel {
  flex: 1; padding: 14px; border: none; border-radius: 12px;
  background: var(--surface2); color: var(--muted);
  font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.modal-add {
  flex: 2; padding: 14px; border: none; border-radius: 12px;
  background: var(--sp); color: #fff;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
}
</style>
</head>
<body>

<div id="onboarding" class="screen hidden">
  <div class="ob-header">
    <h1 class="ob-title">Choose your companion</h1>
    <p class="ob-subtitle">They’ll grow as you stay consistent</p>
  </div>
  <div class="species-grid" id="speciesGrid"></div>
  <button id="beginBtn" disabled>Pick a companion</button>
</div>

<div id="home" class="screen hidden">
  <div class="char-section">
    <div class="char-center">
      <div class="char-glow" id="charGlow"></div>
      <span class="char-emoji" id="charEmoji"></span>
    </div>
    <span class="char-name" id="charName"></span>
    <span class="char-mood" id="charMood"></span>
  </div>
  <div class="habit-section">
    <div class="habit-header">
      <span class="habit-header-title">Today</span>
      <button id="markAllBtn" class="hidden-btn">Mark all done</button>
    </div>
    <div class="habit-grid" id="habitGrid"></div>
  </div>
  <div class="date-section">
    <div class="date-hero">
      <span class="date-month-lbl" id="dateMonth"></span>
      <span class="date-day-num"   id="dateDay"></span>
      <span class="date-year-lbl"  id="dateYear"></span>
    </div>
    <div class="week-strip" id="weekStrip"></div>
  </div>
  <div class="bottom-bar" id="addBar">
    <div class="bottom-bar-inner">
      <span class="bottom-bar-placeholder">Add a habit…</span>
      <div class="bottom-bar-pill" id="addPill">+</div>
    </div>
  </div>
</div>

<div id="addModal" class="modal-overlay hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <p class="modal-title">New habit</p>
    <input class="modal-input" id="habitInput" type="text" placeholder="e.g. Drink water, Read 10 pages…" maxlength="60" autocomplete="off" />
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelAdd">Cancel</button>
      <button class="modal-add" id="confirmAdd">Add habit</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'consistent_v2';
const SPECIES = [
  { id:'ember',  name:'Ember',  emoji:'🔥', hint:'A fiery trailblazer', color:'#f97316', glow:'rgba(249,115,22,0.18)'  },
  { id:'sprout', name:'Sprout', emoji:'🌱', hint:'Patient and steady',   color:'#22c55e', glow:'rgba(34,197,94,0.18)'   },
  { id:'pebble', name:'Pebble', emoji:'🪨', hint:'Grounded and strong',  color:'#94a3b8', glow:'rgba(148,163,184,0.18)' },
  { id:'wisp',   name:'Wisp',   emoji:'✨',     hint:'Curious and bright',   color:'#a78bfa', glow:'rgba(167,139,250,0.18)' },
];
const MONTHS   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_SHORT = ['M','T','W','T','F','S','S'];

function today() { return new Date().toISOString().slice(0,10); }
function isDone(c) { return c.includes(today()); }
function calcStreak(c) {
  if (!c.length) return 0;
  const s=[...c].sort(), t=today(), last=s[s.length-1];
  if (last!==t) { const y=new Date(Date.now()-864e5).toISOString().slice(0,10); if(last!==y)return 0; }
  let n=1;
  for (let i=s.length-1;i>0;i--) { const d=(new Date(s[i])-new Date(s[i-1]))/864e5; if(d===1)n++; else break; }
  return n;
}
function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||null; } catch { return null; } }
function save(d) { localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); }
function $(id) { return document.getElementById(id); }
function el(tag,cls) { const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexToRgb(hex) { return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(','); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); $(id).classList.remove('hidden'); }

let state = load();

function init() { state?.character ? showHome() : showOnboarding(); }

function showOnboarding() {
  showScreen('onboarding');
  const grid=$('speciesGrid'); grid.innerHTML=''; let sel=null;
  SPECIES.forEach(sp => {
    const c=el('div','species-card');
    c.innerHTML=`<span class="species-emoji">${sp.emoji}</span><span class="species-name">${sp.name}</span><span class="species-hint">${sp.hint}</span>`;
    c.onclick=()=>{
      document.querySelectorAll('.species-card').forEach(x=>x.classList.remove('selected')); c.classList.add('selected'); sel=sp.id;
      const b=$('beginBtn'); b.textContent=`Begin with ${sp.name}`; b.style.background=sp.color; b.style.color='#fff'; b.disabled=false;
      document.documentElement.style.setProperty('--sp',sp.color);
    };
    grid.appendChild(c);
  });
  $('beginBtn').addEventListener('click',()=>{ if(!sel)return; state={character:{species:sel},habits:[]}; save(state); showHome(); },{once:true});
}

function sp() { return SPECIES.find(s=>s.id===state.character.species)||SPECIES[3]; }

function showHome() {
  showScreen('home');
  const s=sp();
  document.documentElement.style.setProperty('--sp',s.color);
  $('charGlow').style.background=s.glow;
  $('addPill').style.background=s.color;
  render();
  $('addBar').onclick=openModal;
  $('markAllBtn').onclick=()=>{
    const t=today(); state.habits.forEach(h=>{ if(isDone(h.completions))return; h.completions.push(t); const k=calcStreak(h.completions); if(k>(h.bestStreak||0))h.bestStreak=k; });
    save(state); render();
  };
}

function render() { renderChar(); renderHabits(); renderDate(); }

function renderChar() {
  const s=sp(), done=state.habits.filter(h=>isDone(h.completions)).length, tot=state.habits.length;
  const mood=tot===0?'Add habits below to begin':done===tot?'✨ All done today!':done>0?`${done} of ${tot} done today`:'Ready when you are…';
  $('charEmoji').textContent=s.emoji; $('charName').textContent=s.name; $('charName').style.color=s.color; $('charMood').textContent=mood;
}

function renderHabits() {
  const g=$('habitGrid'), habs=state.habits, allDone=habs.length>0&&habs.every(h=>isDone(h.completions));
  $('markAllBtn').classList.toggle('hidden-btn',allDone||habs.length<=1);
  if (!habs.length) { g.innerHTML='<div class="habit-empty">Tap below to add your first habit</div>'; return; }
  const MAX=9, count=habs.length, total=Math.min(count,MAX)+(count>MAX?1:0);
  const cols=total<=2?total:total<=4?2:3, size=calcSize(cols,total);
  g.style.gridTemplateColumns=`repeat(${cols},${size}px)`; g.innerHTML='';
  habs.slice(0,MAX).forEach(h=>{
    const done=isDone(h.completions), streak=calcStreak(h.completions);
    const c=el('div','habit-circle'+(done?' done':''));
    c.style.width=c.style.height=size+'px';
    const fs=Math.max(10,Math.floor(size*.13));
    c.innerHTML=(streak?`<span class="circle-streak" style="font-size:${Math.max(8,Math.floor(size*.09))}px">🔥${streak}</span>`:'')
      +`<span class="circle-name" style="font-size:${fs}px">${esc(h.name)}</span>`
      +(done?`<span class="circle-check" style="font-size:${Math.floor(size*.18)}px">✓</span>`:'');
    c.onclick=()=>markDone(h.id,c);
    c.oncontextmenu=e=>{e.preventDefault();del(h.id);};
    g.appendChild(c);
  });
  if (count>MAX) {
    const o=el('div','habit-circle'); o.style.width=o.style.height=size+'px';
    o.innerHTML=`<span style="color:var(--muted);font-size:18px;font-weight:700;position:relative;z-index:1">+${count-MAX}</span>`;
    g.appendChild(o);
  }
}

function calcSize(cols,total) {
  const W=Math.min(window.innerWidth,600),HPAD=48,GAP=12,rows=Math.ceil(total/cols);
  const sec=document.querySelector('.habit-section'), availH=sec?sec.clientHeight-36:220;
  return Math.floor(Math.min((W-HPAD-(cols-1)*GAP)/cols,(availH-(rows-1)*GAP)/rows,180));
}

function markDone(id,circleEl) {
  const h=state.habits.find(x=>x.id===id); if(!h||isDone(h.completions))return;
  h.completions.push(today()); const k=calcStreak(h.completions); if(k>(h.bestStreak||0))h.bestStreak=k;
  save(state); circleEl.classList.add('done','pop'); circleEl.addEventListener('animationend',()=>circleEl.classList.remove('pop'),{once:true});
  render();
}

function del(id) {
  if(confirm('Remove this habit? Streak history will be lost.')) { state.habits=state.habits.filter(h=>h.id!==id); save(state); render(); }
}

function renderDate() {
  const now=new Date(), s=sp(), r=hexToRgb(s.color), todayStr=today();
  $('dateMonth').textContent=MONTHS[now.getMonth()].toUpperCase();
  $('dateDay').textContent=now.getDate();
  $('dateYear').textContent=now.getFullYear();
  const dow=now.getDay(), monday=new Date(now);
  monday.setDate(monday.getDate()-(dow===0?6:dow-1)); monday.setHours(0,0,0,0);
  const strip=$('weekStrip'); strip.innerHTML='';
  for (let i=0;i<7;i++) {
    const d=new Date(monday); d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10), isToday=ds===todayStr, isFuture=ds>todayStr;
    const ratio=isFuture||!state.habits.length?0:state.habits.filter(h=>h.completions.includes(ds)).length/state.habits.length;
    const item=el('div','wday'), lbl=el('span','wday-lbl'); lbl.textContent=DAY_SHORT[i];
    const dot=el('div','wday-dot'+(isToday?' is-today':'')+(isFuture?' is-future':''));
    if (!isFuture&&ratio>0) { dot.style.background=`rgba(${r},${(0.25+ratio*0.65).toFixed(2)})`; if(!isToday)dot.style.borderColor=s.color; }
    const num=el('span','wday-num'); num.textContent=d.getDate(); if(isToday)num.style.color=s.color;
    dot.appendChild(num); item.appendChild(lbl); item.appendChild(dot); strip.appendChild(item);
  }
}

function openModal() { $('addModal').classList.remove('hidden'); setTimeout(()=>$('habitInput').focus(),50); }
function closeModal() { $('addModal').classList.add('hidden'); $('habitInput').value=''; }
function submitHabit() {
  const name=$('habitInput').value.trim(); if(!name)return;
  state.habits.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,createdAt:today(),completions:[],bestStreak:0});
  save(state); closeModal(); render();
}

$('cancelAdd').onclick=closeModal;
$('confirmAdd').onclick=submitHabit;
$('modalBackdrop').onclick=closeModal;
$('habitInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitHabit();});
window.addEventListener('resize',()=>{if(state?.character)renderHabits();});

init();
</script>
</body>
</html>
