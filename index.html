<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Consistent</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0f13;
  --surface:  #1a1a22;
  --surface2: #24242f;
  --border:   #2e2e3e;
  --text:     #e8e8f0;
  --muted:    #7a7a9a;
  --dim:      #4a4a6a;
  --danger:   #e05252;
  --sp:       #a78bfa;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.hidden { display: none !important; }

/* ── Onboarding ─────────────────────────────────────────── */
#onboarding {
  align-items: center;
  justify-content: space-between;
  padding: 40px 24px 32px;
}
.ob-header { text-align: center; }
.ob-title    { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.ob-subtitle { font-size: 14px; color: var(--muted); }

.species-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 360px;
}

.species-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.species-card.selected {
  border-color: var(--sp);
  background: rgba(167,139,250,0.1);
}
.species-emoji  { font-size: 44px; line-height: 1; }
.species-name   { font-size: 17px; font-weight: 700; }
.species-hint   { font-size: 12px; color: var(--muted); text-align: center; }

#beginBtn {
  width: 100%;
  max-width: 360px;
  padding: 18px;
  border: none;
  border-radius: 14px;
  background: var(--border);
  color: var(--muted);
  font-size: 17px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s, color .2s;
}
#beginBtn.ready { background: var(--sp); color: #fff; }

/* ── Home ───────────────────────────────────────────────── */
#home { overflow: hidden; }

/* Character */
.char-section {
  flex-shrink: 0;
  height: 236px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.char-center {
  position: relative;
  width: 110px;
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.char-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(167,139,250,0.18);
  animation: pulseGlow 4s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { transform: scale(1);    opacity: .8; }
  50%       { transform: scale(1.2); opacity: 1;  }
}
.char-emoji { font-size: 68px; position: relative; z-index: 1; line-height: 1; }
.char-name  { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.char-level {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sp);
  margin-top: 1px;
}
@keyframes lvlPop {
  0%,100% { transform: scale(1); }
  40%     { transform: scale(1.5); }
}
.char-level.lvl-up { animation: lvlPop .45s cubic-bezier(.34,1.56,.64,1); }
.xp-wrap {
  width: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  margin-top: 3px;
}
.xp-track {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.xp-fill {
  height: 100%;
  background: var(--sp);
  border-radius: 2px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
.xp-lbl { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
.char-mood  { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* XP floater */
.xp-floater {
  position: fixed;
  z-index: 300;
  font-size: 13px;
  font-weight: 800;
  color: var(--sp);
  pointer-events: none;
  white-space: nowrap;
  transform: translateX(-50%);
  display: none;
}
@keyframes xpRise {
  0%   { transform: translateX(-50%) translateY(0);    opacity: 1; }
  100% { transform: translateX(-50%) translateY(-64px); opacity: 0; }
}
.xp-floater.rise { animation: xpRise 1s ease-out forwards; }

/* Habits */
.habit-section {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0 24px;
  overflow: hidden;
  justify-content: center;
}
.habit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-shrink: 0;
}
.habit-header-title { font-size: 16px; font-weight: 700; }
#markAllBtn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--sp);
  cursor: pointer;
  padding: 4px 0;
}
#markAllBtn.hidden-btn { visibility: hidden; }

.habit-grid {
  display: grid;
  gap: 12px;
  align-content: start;
  justify-content: center;
}
.habit-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
  font-size: 14px;
  text-align: center;
  padding: 24px 0;
}

.habit-circle {
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color .25s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.habit-circle::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--sp);
  opacity: 0;
  transition: opacity .28s ease;
}
.habit-circle.done { border-color: var(--sp); }
.habit-circle.done::before { opacity: 1; }
.habit-circle.pop { animation: circlePop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes circlePop {
  0%   { transform: scale(1); }
  35%  { transform: scale(.87); }
  100% { transform: scale(1); }
}

.circle-streak {
  position: relative;
  z-index: 1;
  font-size: 10px;
  color: rgba(255,255,255,.6);
  font-weight: 600;
  line-height: 1;
}
.circle-name {
  position: relative;
  z-index: 1;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  color: var(--muted);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  word-break: break-word;
  transition: color .25s;
}
.habit-circle.done .circle-name { color: #fff; }
.circle-check {
  position: relative;
  z-index: 1;
  font-size: 16px;
  color: rgba(255,255,255,.85);
  font-weight: 700;
  line-height: 1;
}

/* Date Section */
.date-section { flex-shrink: 0; padding: 12px 24px 0; }
.date-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.date-month-lbl {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  flex: 1;
}
.date-day-num {
  font-size: 80px;
  font-weight: 900;
  color: var(--sp);
  line-height: 1;
  letter-spacing: -0.04em;
  text-align: center;
  flex: 1;
}
.date-year-lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-align: right;
  flex: 1;
}

/* Bottom Bar */
.bottom-bar {
  flex-shrink: 0;
  padding: 6px 16px 10px;
}
.bottom-bar-inner {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 10px 10px 10px 18px;
  cursor: pointer;
  gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-bar-placeholder { flex: 1; color: var(--dim); font-size: 15px; }
.bottom-bar-pill {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--sp);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #fff;
  font-weight: 300;
  line-height: 1;
  flex-shrink: 0;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  z-index: 100;
}
.modal-backdrop {
  flex: 1;
  background: rgba(0,0,0,.5);
}
.modal-sheet {
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  padding: 16px 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,1,.6,1);
}
.modal-overlay:not(.hidden) .modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: #3a3a50;
  align-self: center;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-input {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  padding: 14px 16px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.modal-input:focus { border-color: var(--sp); }
.modal-input::placeholder { color: var(--dim); }
.modal-actions { display: flex; gap: 10px; }
.modal-cancel {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: var(--surface2);
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.modal-add {
  flex: 2;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: var(--sp);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ── Onboarding ──────────────────────────────────── -->
<div id="onboarding" class="screen hidden">
  <div class="ob-header">
    <h1 class="ob-title">Choose your companion</h1>
    <p class="ob-subtitle">They'll grow as you stay consistent</p>
  </div>
  <div class="species-grid" id="speciesGrid"></div>
  <button id="beginBtn" disabled>Pick a companion</button>
</div>

<!-- ── Home ───────────────────────────────────────── -->
<div id="home" class="screen hidden">
  <div class="date-section">
    <div class="date-hero">
      <span class="date-month-lbl" id="dateMonth"></span>
      <span class="date-day-num"   id="dateDay"></span>
      <span class="date-year-lbl"  id="dateYear"></span>
    </div>
  </div>

  <div class="char-section">
    <div class="char-center">
      <div class="char-glow" id="charGlow"></div>
      <span class="char-emoji" id="charEmoji"></span>
    </div>
    <span class="char-name" id="charName"></span>
    <span class="char-level" id="charLevel">Lv 1 · Wanderer</span>
    <div class="xp-wrap">
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      <span class="xp-lbl" id="xpLbl">0 / 100 XP</span>
    </div>
    <span class="char-mood" id="charMood"></span>
  </div>

  <div class="habit-section">
    <div class="habit-header">
      <span class="habit-header-title">Today</span>
      <button id="markAllBtn" class="hidden-btn">Mark all done</button>
    </div>
    <div class="habit-grid" id="habitGrid"></div>
  </div>

  <div class="bottom-bar" id="addBar">
    <div class="bottom-bar-inner">
      <span class="bottom-bar-placeholder">Add a habit…</span>
      <div class="bottom-bar-pill" id="addPill">+</div>
    </div>
  </div>
</div>

<!-- ── Add Modal ──────────────────────────────────── -->
<div id="addModal" class="modal-overlay hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <p class="modal-title">New habit</p>
    <input class="modal-input" id="habitInput" type="text" placeholder="e.g. Drink water, Read 10 pages…" maxlength="60" autocomplete="off" />
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelAdd">Cancel</button>
      <button class="modal-add" id="confirmAdd">Add habit</button>
    </div>
  </div>
</div>

<div id="xpFloater" class="xp-floater"></div>

<script>
const STORAGE_KEY = 'consistent_v2';

const SPECIES = [
  { id: 'ember',  name: 'Ember',  emoji: '🔥', hint: 'A fiery trailblazer', color: '#f97316', glow: 'rgba(249,115,22,0.18)'  },
  { id: 'sprout', name: 'Sprout', emoji: '🌱', hint: 'Patient and steady',   color: '#22c55e', glow: 'rgba(34,197,94,0.18)'   },
  { id: 'pebble', name: 'Pebble', emoji: '🪨', hint: 'Grounded and strong',  color: '#94a3b8', glow: 'rgba(148,163,184,0.18)' },
  { id: 'wisp',   name: 'Wisp',   emoji: '✨', hint: 'Curious and bright',   color: '#a78bfa', glow: 'rgba(167,139,250,0.18)' },
];

// ── XP System ──────────────────────────────────────────────
const XP_THRESHOLDS = [0, 100, 275, 550, 1100, 2200];
const LEVEL_NAMES   = ['Wanderer','Apprentice','Keeper','Guardian','Champion','Legend'];
const SPECIES_EVO   = {
  ember:  ['🔥','⚡','🌋','☄️','🌞','✴️'],
  sprout: ['🌱','🌿','🌳','🌴','🌲','🎋'],
  pebble: ['🪨','⚫','🔵','💎','💠','🔮'],
  wisp:   ['✨','💫','⭐','🌟','🌠','🪐'],
};
const XP_BASE = 10;
const XP_STREAK_BONUS = 2; // per streak day
const XP_STREAK_CAP   = 20;

function getLevelInfo(xp = 0) {
  let lvl = 0;
  while (lvl < XP_THRESHOLDS.length - 1 && xp >= XP_THRESHOLDS[lvl + 1]) lvl++;
  const isMax     = lvl >= XP_THRESHOLDS.length - 1;
  const xpStart   = XP_THRESHOLDS[lvl];
  const xpEnd     = isMax ? null : XP_THRESHOLDS[lvl + 1];
  const into      = xp - xpStart;
  const needed    = isMax ? null : xpEnd - xpStart;
  return { level: lvl + 1, name: LEVEL_NAMES[lvl], into, needed, progress: isMax ? 1 : into / needed, isMax };
}

function xpForCompletion(streak) {
  return XP_BASE + Math.min(streak * XP_STREAK_BONUS, XP_STREAK_CAP);
}

const MONTHS   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_ABBR = ['S','M','T','W','T','F','S'];

// ── Data ──────────────────────────────────────────
function today() { return new Date().toISOString().slice(0, 10); }
function isDone(completions) { return completions.includes(today()); }

function calcStreak(completions) {
  if (!completions.length) return 0;
  const sorted = [...completions].sort();
  const t = today();
  const last = sorted[sorted.length - 1];
  if (last !== t) {
    const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    if (last !== yest) return 0;
  }
  let s = 1;
  for (let i = sorted.length - 1; i > 0; i--) {
    const diff = (new Date(sorted[i]) - new Date(sorted[i-1])) / 864e5;
    if (diff === 1) s++; else break;
  }
  return s;
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let state = load();

// ── Init ──────────────────────────────────────────
function init() {
  if (!state?.character) showOnboarding();
  else {
    if (!('xp' in state.character)) state.character.xp = 0;
    showHome();
  }
}

// ── Onboarding ────────────────────────────────────
function showOnboarding() {
  show('onboarding');
  const grid = $('speciesGrid');
  grid.innerHTML = '';
  let selectedId = null;

  SPECIES.forEach(sp => {
    const card = el('div', 'species-card');
    card.innerHTML = `<span class="species-emoji">${sp.emoji}</span>
      <span class="species-name">${sp.name}</span>
      <span class="species-hint">${sp.hint}</span>`;
    card.addEventListener('click', () => {
      document.querySelectorAll('.species-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedId = sp.id;
      const btn = $('beginBtn');
      btn.textContent = `Begin with ${sp.name}`;
      btn.style.background = sp.color;
      btn.style.color = '#fff';
      btn.disabled = false;
    });
    grid.appendChild(card);
  });

  $('beginBtn').addEventListener('click', () => {
    if (!selectedId) return;
    state = { character: { species: selectedId, xp: 0 }, habits: [] };
    save(state);
    showHome();
  }, { once: true });
}

// ── Home ──────────────────────────────────────────
function showHome() {
  show('home');
  applySpeciesTheme();
  renderCharacter();
  renderHabits();
  renderDate();
  bindHomeEvents();
}

function applySpeciesTheme() {
  const sp = getSpecies();
  document.documentElement.style.setProperty('--sp', sp.color);
  $('charGlow').style.background = sp.glow;
  $('addPill').style.background  = sp.color;
}

function getSpecies() {
  return SPECIES.find(s => s.id === state.character.species) || SPECIES[3];
}

function renderCharacter() {
  const sp   = getSpecies();
  const xp   = state.character.xp || 0;
  const info = getLevelInfo(xp);
  const evo  = SPECIES_EVO[sp.id] || SPECIES_EVO.wisp;

  $('charEmoji').textContent = evo[Math.min(info.level - 1, evo.length - 1)];
  $('charName').textContent  = sp.name;
  $('charName').style.color  = sp.color;
  $('charLevel').textContent = `Lv ${info.level} · ${info.name}`;
  $('xpFill').style.width    = (info.progress * 100) + '%';
  $('xpLbl').textContent     = info.isMax ? `${xp} XP · MAX` : `${info.into} / ${info.needed} XP`;

  const done  = state.habits.filter(h => isDone(h.completions)).length;
  const total = state.habits.length;
  const mood  = total === 0   ? 'Add habits to start earning XP'
    : done === total           ? '✨ All done! XP earned today'
    : done > 0                 ? `${done} of ${total} done · keep going!`
    :                            'Ready when you are…';
  $('charMood').textContent = mood;
}

function renderHabits() {
  const grid    = $('habitGrid');
  const habits  = state.habits;
  const markAll = $('markAllBtn');
  const allDone = habits.length > 0 && habits.every(h => isDone(h.completions));

  markAll.classList.toggle('hidden-btn', allDone || habits.length <= 1);

  if (!habits.length) {
    grid.innerHTML = '<div class="habit-empty">Tap below to add your first habit</div>';
    return;
  }

  const MAX = 9;
  const count  = habits.length;
  const total  = Math.min(count, MAX) + (count > MAX ? 1 : 0);
  const cols   = total <= 2 ? total : total <= 4 ? 2 : 3;
  const size   = calcCircleSize(cols, Math.min(count, MAX) + (count > MAX ? 1 : 0));

  grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  grid.innerHTML = '';

  habits.slice(0, MAX).forEach(habit => {
    const done   = isDone(habit.completions);
    const streak = calcStreak(habit.completions);
    const circle = el('div', 'habit-circle' + (done ? ' done' : ''));
    circle.style.width  = size + 'px';
    circle.style.height = size + 'px';
    const fs = Math.max(10, Math.floor(size * 0.13));

    circle.innerHTML = (streak > 0 ? `<span class="circle-streak" style="font-size:${Math.max(8,Math.floor(size*.09))}px">🔥${streak}</span>` : '')
      + `<span class="circle-name" style="font-size:${fs}px">${escHtml(habit.name)}</span>`
      + (done ? `<span class="circle-check" style="font-size:${Math.floor(size*.18)}px">✓</span>` : '');

    circle.addEventListener('click', () => markHabitDone(habit.id, circle));
    circle.addEventListener('contextmenu', e => { e.preventDefault(); confirmDelete(habit.id); });
    grid.appendChild(circle);
  });

  if (count > MAX) {
    const overflow = el('div', 'habit-circle');
    overflow.style.width  = size + 'px';
    overflow.style.height = size + 'px';
    overflow.innerHTML = `<span style="color:var(--muted);font-size:18px;font-weight:700;position:relative;z-index:1">+${count - MAX}</span>`;
    grid.appendChild(overflow);
  }
}

function calcCircleSize(cols, totalCells) {
  const W = Math.min(window.innerWidth, 600);
  const HPAD = 48, GAP = 12;
  const rows = Math.ceil(totalCells / cols);
  const habitSection = document.querySelector('.habit-section');
  const availH = habitSection ? habitSection.clientHeight - 36 : 220;
  const maxW = (W - HPAD - (cols - 1) * GAP) / cols;
  const maxH = (availH - (rows - 1) * GAP) / rows;
  return Math.floor(Math.min(maxW, maxH, 180));
}

function markHabitDone(id, circleEl) {
  const habit = state.habits.find(h => h.id === id);
  if (!habit || isDone(habit.completions)) return;
  habit.completions.push(today());
  const streak = calcStreak(habit.completions);
  if (streak > (habit.bestStreak || 0)) habit.bestStreak = streak;

  const earned   = xpForCompletion(streak);
  const oldLevel = getLevelInfo(state.character.xp || 0).level;
  state.character.xp = (state.character.xp || 0) + earned;
  const newLevel = getLevelInfo(state.character.xp).level;

  save(state);

  const rect = circleEl.getBoundingClientRect();
  circleEl.classList.add('done', 'pop');
  circleEl.addEventListener('animationend', () => circleEl.classList.remove('pop'), { once: true });

  showXpFloat(rect.left + rect.width / 2, rect.top + 10, earned, streak > 1);

  if (newLevel > oldLevel) flashLevelUp();

  renderCharacter();
  renderHabits();
  renderDate();
}

function showXpFloat(x, y, xp, streakBonus) {
  const el = $('xpFloater');
  el.textContent = streakBonus ? `+${xp} XP 🔥` : `+${xp} XP`;
  el.style.left  = x + 'px';
  el.style.top   = y + 'px';
  el.style.display = 'block';
  el.classList.remove('rise');
  void el.offsetWidth;
  el.classList.add('rise');
  setTimeout(() => { el.style.display = 'none'; }, 1050);
}

function flashLevelUp() {
  const el = $('charLevel');
  el.classList.remove('lvl-up');
  void el.offsetWidth;
  el.classList.add('lvl-up');
  el.addEventListener('animationend', () => el.classList.remove('lvl-up'), { once: true });
}

function confirmDelete(id) {
  if (confirm('Remove this habit? This will delete its streak history.')) {
    state.habits = state.habits.filter(h => h.id !== id);
    save(state);
    renderHabits();
    renderCharacter();
    renderDate();
  }
}

function renderDate() {
  const now = new Date();
  $('dateMonth').textContent = MONTHS[now.getMonth()].toUpperCase();
  $('dateDay').textContent   = now.getDate();
  $('dateYear').textContent  = now.getFullYear();
}

function bindHomeEvents() {
  $('addBar').addEventListener('click', openModal);
  $('markAllBtn').addEventListener('click', () => {
    const t = today();
    const oldLevel = getLevelInfo(state.character.xp || 0).level;
    state.habits.forEach(h => {
      if (isDone(h.completions)) return;
      h.completions.push(t);
      const s = calcStreak(h.completions);
      if (s > (h.bestStreak||0)) h.bestStreak = s;
      state.character.xp = (state.character.xp || 0) + xpForCompletion(s);
    });
    const newLevel = getLevelInfo(state.character.xp).level;
    if (newLevel > oldLevel) flashLevelUp();
    save(state);
    renderCharacter();
    renderHabits();
    renderDate();
  });
}

// ── Modal ─────────────────────────────────────────
function openModal() {
  $('addModal').classList.remove('hidden');
  setTimeout(() => $('habitInput').focus(), 50);
}
function closeModal() {
  $('addModal').classList.add('hidden');
  $('habitInput').value = '';
}
function submitHabit() {
  const name = $('habitInput').value.trim();
  if (!name) return;
  state.habits.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, createdAt: today(), completions: [], bestStreak: 0,
  });
  save(state);
  closeModal();
  renderCharacter();
  renderHabits();
  renderDate();
}

$('cancelAdd').addEventListener('click', closeModal);
$('confirmAdd').addEventListener('click', submitHabit);
$('modalBackdrop').addEventListener('click', closeModal);
$('habitInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitHabit(); });

// ── Utils ─────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function show(id) {
  ['onboarding','home'].forEach(s => $('s' === s ? s : s).classList.add('hidden'));
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)].join(',');
}

window.addEventListener('resize', () => { if (state?.character) renderHabits(); });

init();
</script>
