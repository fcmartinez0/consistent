<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consistent</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --surface2: #24242f;
  --border: #2e2e3e;
  --text: #e8e8f0;
  --text-muted: #7a7a9a;
  --accent: #7c6af7;
  --accent-hover: #9180ff;
  --done: #2a9d5c;
  --done-hover: #33b86a;
  --danger: #e05252;
  --danger-hover: #f06060;
  --streak: #ff8c42;
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.2s ease;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 24px 16px 80px;
  line-height: 1.5;
}

header {
  max-width: 560px;
  margin: 0 auto 32px;
  text-align: center;
}

header h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #a78bfa 0%, #7c6af7 50%, #5b4fcf 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}

header p {
  color: var(--text-muted);
  font-size: 0.9rem;
}

.add-form {
  max-width: 560px;
  margin: 0 auto 32px;
  display: flex;
  gap: 10px;
}

.add-form input {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-family: inherit;
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}

.add-form input::placeholder { color: var(--text-muted); }

.add-form input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.15);
}

.add-form button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 14px 22px;
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition);
  white-space: nowrap;
}

.add-form button:hover { background: var(--accent-hover); }
.add-form button:active { transform: scale(0.97); }

.habits-grid {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 1rem;
}

.habit-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: slideIn 0.25s ease;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.habit-card:hover {
  border-color: #3a3a50;
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

.habit-card.is-done {
  border-color: rgba(42, 157, 92, 0.35);
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.habit-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.habit-name {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  word-break: break-word;
}

.habit-delete {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  font-size: 1rem;
  line-height: 1;
  transition: color var(--transition), background var(--transition);
  flex-shrink: 0;
}

.habit-delete:hover {
  color: var(--danger);
  background: rgba(224, 82, 82, 0.12);
}

.habit-stats {
  display: flex;
  gap: 20px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  font-weight: 600;
}

.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}

.stat-value.streak-current {
  color: var(--streak);
}

.done-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition), opacity var(--transition);
  letter-spacing: 0.01em;
}

.done-btn.pending {
  background: var(--accent);
  color: #fff;
}

.done-btn.pending:hover { background: var(--accent-hover); }
.done-btn.pending:active { transform: scale(0.98); }

.done-btn.completed {
  background: rgba(42, 157, 92, 0.18);
  color: var(--done);
  cursor: default;
  border: 1.5px solid rgba(42, 157, 92, 0.3);
}

@keyframes checkPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(0.96); }
  70%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.done-btn.pop {
  animation: checkPop 0.35s ease;
}
</style>
</head>
<body>

<header>
  <h1>Consistent</h1>
  <p>Build habits. Protect your streak.</p>
</header>

<form class="add-form" id="addForm">
  <input type="text" id="habitInput" placeholder="Add a new habit…" maxlength="80" autocomplete="off" />
  <button type="submit">Add</button>
</form>

<div class="habits-grid" id="habitsGrid"></div>

<script>
const STORAGE_KEY = 'consistency_habits';

function today() {
  return new Date().toISOString().slice(0, 10);
}

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function save(habits) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

function calcStreak(completions) {
  if (!completions.length) return 0;
  const sorted = [...completions].sort();
  const todayStr = today();
  const last = sorted[sorted.length - 1];
  if (last !== todayStr) {
    const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    if (last !== yesterday) return 0;
  }
  let streak = 1;
  for (let i = sorted.length - 1; i > 0; i--) {
    const cur = new Date(sorted[i]);
    const prev = new Date(sorted[i - 1]);
    const diff = (cur - prev) / 864e5;
    if (diff === 1) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function isDoneToday(completions) {
  return completions.includes(today());
}

function renderAll() {
  const habits = load();
  const grid = document.getElementById('habitsGrid');
  grid.innerHTML = '';

  if (!habits.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🌱</div><p>No habits yet. Add one above to get started.</p></div>';
    return;
  }

  habits.forEach(habit => {
    const done = isDoneToday(habit.completions);
    const streak = calcStreak(habit.completions);
    const best = habit.bestStreak || 0;

    const card = document.createElement('div');
    card.className = 'habit-card' + (done ? ' is-done' : '');
    card.dataset.id = habit.id;

    card.innerHTML = `
      <div class="habit-top">
        <span class="habit-name">${escHtml(habit.name)}</span>
        <button class="habit-delete" aria-label="Delete habit" data-id="${habit.id}">✕</button>
      </div>
      <div class="habit-stats">
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value streak-current">🔥 ${streak}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value">⭐ ${best}</span>
        </div>
      </div>
      <button class="done-btn ${done ? 'completed' : 'pending'}" data-id="${habit.id}" ${done ? 'disabled' : ''}>
        ${done ? '✓ Done for today' : 'Mark done for today'}
      </button>
    `;

    grid.appendChild(card);
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('addForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const input = document.getElementById('habitInput');
  const name = input.value.trim();
  if (!name) return;
  const habits = load();
  habits.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name,
    createdAt: today(),
    completions: [],
    bestStreak: 0
  });
  save(habits);
  input.value = '';
  renderAll();
});

document.getElementById('habitsGrid').addEventListener('click', function(e) {
  const delBtn = e.target.closest('.habit-delete');
  if (delBtn) {
    const id = delBtn.dataset.id;
    const habits = load().filter(h => h.id !== id);
    save(habits);
    renderAll();
    return;
  }

  const doneBtn = e.target.closest('.done-btn.pending');
  if (doneBtn) {
    const id = doneBtn.dataset.id;
    const habits = load();
    const habit = habits.find(h => h.id === id);
    if (!habit || isDoneToday(habit.completions)) return;
    habit.completions.push(today());
    const streak = calcStreak(habit.completions);
    if (streak > (habit.bestStreak || 0)) habit.bestStreak = streak;
    save(habits);

    doneBtn.classList.remove('pending');
    doneBtn.classList.add('completed', 'pop');
    doneBtn.disabled = true;
    doneBtn.textContent = '✓ Done for today';

    const card = doneBtn.closest('.habit-card');
    if (card) card.classList.add('is-done');

    const streakEl = card && card.querySelector('.streak-current');
    if (streakEl) streakEl.textContent = '🔥 ' + streak;

    const bestEl = card && card.querySelectorAll('.stat-value')[1];
    if (bestEl) bestEl.textContent = '⭐ ' + habit.bestStreak;

    doneBtn.addEventListener('animationend', () => doneBtn.classList.remove('pop'), { once: true });
    return;
  }
});

renderAll();
</script>
</body>
</html>
